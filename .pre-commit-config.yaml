repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-compat
        name: Check compatibility markers
        entry: python .github/scripts/check_compat.py
        language: python
        pass_filenames: false
        always_run: true
