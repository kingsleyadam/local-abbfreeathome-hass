virtual_device:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: abbfreeathome_ci
    type:
      required: true
      default: SwitchingActuator
      example: SwitchingActuator
      selector:
        select:
          mode: dropdown
          custom_value: true
          translation_key: virtual_device_type
          options:
            - SwitchingActuator
            - DimActuator
            - WindowSensor
            - RTC
            - WeatherStation
            - Weather-BrightnessSensor
            - Weather-RainSensor
            - Weather-TemperatureSensor
            - Weather-WindSensor
            - AirQualityTemperature
            - EnergyMeterv2
    displayname:
      required: false
      example: Virtual switch
      selector:
        text:
    serial:
      required: true
      example: ha-virtual-switch-01
      selector:
        text:
    ttl:
      required: false
      default: "-1"
      example: "-1"
      selector:
        select:
          mode: dropdown
          custom_value: true
          translation_key: virtual_device_lifetime
          options:
            - "-1"
            - "0"
            - "180"
            - "300"
            - "3600"
            - "86400"
    energy_meter:
      collapsed: true
      fields:
        flavor:
          required: false
          example: E
          selector:
            select:
              options:
                - E
              custom_value: true
              mode: dropdown
        capabilities:
          required: false
          example: [16, 17, 18, 19, 22, 28]
          selector:
            object:
